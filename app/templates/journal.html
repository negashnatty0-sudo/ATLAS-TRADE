{% extends "base.html" %}{% block content %}<div class="hero"><h1>Trading Journal</h1><a class="button" href="/dashboard">Back to desk</a></div><div class="card"><table><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Notes</th></tr>{% for t in trades %}<tr><td>{{t.opened_at.strftime('%Y-%m-%d %H:%M')}}</td><td>{{t.symbol}}</td><td>{{t.side}}</td><td>{{t.entry}}</td><td>{{t.exit or '-'}}</td><td>{{t.pnl}}</td><td>{{t.notes}}</td></tr>{% else %}<tr><td colspan="7">No trades yet.</td></tr>{% endfor %}</table></div>{% endblock %}
